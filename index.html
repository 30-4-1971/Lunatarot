<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#111;display:flex;gap:12px;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
  .carta{width:150px;height:240px;perspective:1000px}
  .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.8s}
  .girada{transform:rotateY(180deg)}
  .cara{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px}
  .atras{background:#6b21a8;color:#fff}
  .frente{background:#fff;transform:rotateY(180deg)}
</style>
</head>
<body>
  <div class="carta"><div class="inner" id="c1"><div class="cara atras">✨</div><div class="cara frente" id="f1">🌙</div></div></div>
  <div class="carta"><div class="inner" id="c2"><div class="cara atras">✨</div><div class="cara frente" id="f2">☀️</div></div></div>
  <div class="carta"><div class="inner" id="c3"><div class="cara atras">✨</div><div class="cara frente" id="f3">⭐</div></div></div>

<script>
  const emojis = ["🌙","☀️","⭐","🔮","🃏","🌹","🦋","⚡","🌊","🔥","👁️","💫"];
  function cambiar(){
    // Volver a tapar
    document.querySelectorAll('.inner').forEach(e=>e.classList.remove('girada'));
    setTimeout(()=>{
      // Poner cartas nuevas
      document.getElementById('f1').textContent = emojis[Math.floor(Math.random()*emojis.length)];
      document.getElementById('f2').textContent = emojis[Math.floor(Math.random()*emojis.length)];
      document.getElementById('f3').textContent = emojis[Math.floor(Math.random()*emojis.length)];
      // Girar
      document.querySelectorAll('.inner').forEach(e=>e.classList.add('girada'));
    }, 800);
  }
  // Primera tirada a los 2 segundos
  setTimeout(cambiar, 2000);
  // Después cada 15 segundos, sola
  setInterval(cambiar, 15000);
</script>
</body>
</html>
