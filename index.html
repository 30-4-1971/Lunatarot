<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot Nazaret</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1a0f3d}
body{display:flex;justify-content:center;align-items:flex-start;background:#1a0f3d;font-family:Arial,sans-serif;color:white;text-align:center}
.contenedor{width:100%;max-width:430px;padding:10px 14px 0 14px;background:#1a0f3d}
.logo{font-size:32px}
h1{color:#f5d76e;font-size:30px}
.sub{color:#e6c8ff;font-size:14px;margin-top:2px}
.cartas{display:flex;justify-content:center;gap:10px;margin:10px 0}
.col{width:32%}
.etiqueta{background:#f5d76e;color:#1a1030;padding:5px 6px;border-radius:20px;font-weight:bold;font-size:11px;display:block;margin-bottom:6px}
.carta{width:100%;height:175px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.detras{background:#e6007e;border:3px solid #f5d76e;font-size:36px}
.delante{background:#fff7e6;color:#1a1030;border:3px solid #f5d76e}
.delante .emoji{font-size:34px}
.delante h2{font-size:14px;margin:6px 0 4px;line-height:1.1}
.delante p{font-size:12px;line-height:1.3}
#mensaje{font-size:14px;color:#f5d76e;margin-top:8px}
.tiktok{display:inline-block;background:black;color:white;text-decoration:none;padding:10px 16px;border-radius:30px;font-weight:bold;font-size:13px;border:2px solid #e6007e;margin-top:8px}
.pie{font-size:11px;opacity:0.7;margin-top:6px}
</style>
</head>
<body>
<div class="contenedor">
<div><p class="logo">🌙✨</p><h1>Tarot Nazaret</h1><p class="sub">Tu lectura de hoy, con mucho cariño 💜</p></div>
<div><div class="cartas" id="cartas"></div><div id="mensaje">✨ Las cartas cambian solas ✨</div></div>
<div><a class="tiktok" href="https://www.tiktok.com/@tarotnazaret" target="_blank">🎵 Sígueme @tarotnazaret</a><p class="pie">Hecho con amor por Tarot Nazaret 🌙</p></div>
</div>
<script>
var mazo=[["El Loco","Lánzate, algo nuevo empieza.","🤪"],["El Mago","Tienes todo para empezar.","🎩"],["La Sacerdotisa","Escucha tu voz interior.","🔮"],["La Emperatriz","Cuídate y quiérete mucho.","👑"],["El Emperador","Orden y estabilidad.","🏰"],["El Hierofante","Aprende de quien te guía.","🙏"],["Los Enamorados","El corazón manda.","❤️"],["El Carro","Avanzas, no te pares.","🏎️"],["La Fuerza","Tú puedes con esto.","🦁"],["El Ermitaño","Un momento para ti.","🕯️"],["La Rueda","Viene un cambio bueno.","🎡"],["La Justicia","Todo se pone en su sitio.","⚖️"],["El Colgado","Mira todo de otra forma.","🙃"],["La Muerte","Se acaba algo y nace algo mejor.","🦋"],["La Templanza","Calma, todo llega.","🕊️"],["El Diablo","Suelta lo que te ata.","😈"],["La Torre","Un cambio brusco para bien.","⚡"],["La Estrella","Esperanza y calma.","⭐"],["La Luna","Confía en tu intuición.","🌙"],["El Sol","Viene algo muy bonito.","☀️"],["El Juicio","Es tu momento de renacer.","🎺"],["El Mundo","Se cierra un ciclo bonito.","🌍"]];
var titulos=["PASADO","PRESENTE","FUTURO"];
var copiado=mazo.slice().sort(function(){return Math.random()-0.5}).slice(0,3);
var html="";
for(var i=0;i<3;i++){
html+='<div class="col"><div class="etiqueta">'+titulos[i]+'</div><div class="carta detras" id="carta'+i+'">🌙<br><span style="font-size:11px">TAROT<br>NAZARET</span></div></div>';
}
document.getElementById("cartas").innerHTML=html;
function mostrar(i){
var el=document.getElementById("carta"+i);
el.className="carta delante";
el.innerHTML='<div class="emoji">'+copiado[i][2]+'</div><h2>'+copiado[i][0]+'</h2><p>'+copiado[i][1]+'</p>';
}
setTimeout(function(){mostrar(0)},1000);
setTimeout(function(){mostrar(1)},2500);
setTimeout(function(){mostrar(2)},4000);
// Cambia sola cada 20 segundos
setTimeout(function(){location.reload()},20000);
</script>
</body>
</html>
