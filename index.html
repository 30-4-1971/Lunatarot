<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tarot Nazaret</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0f0a24;color:white;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
.contenedor{height:100vh;height:100dvh;max-width:420px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:18px 10px;background:radial-gradient(circle at 50% 20%, #3b1d6e, #0f0a24 70%);background-image:radial-gradient(white 1px, transparent 1px), radial-gradient(circle at 50% 20%, #3b1d6e, #0f0a24 70%);background-size:30px 30px, cover}
.logo{font-size:42px}
h1{color:#f5d76e;font-size:30px;text-shadow:0 0 20px #e6007e}
.sub{color:#e6c8ff;font-size:15px;margin-top:4px}
button{border:none;padding:15px 22px;font-size:17px;border-radius:30px;cursor:pointer;font-weight:bold}
.btn-tirar{background:linear-gradient(#f5d76e,#e6007e);color:white;box-shadow:0 0 25px #e6007e}
.cartas{display:flex;justify-content:center;gap:10px;margin:18px 0}
.col{width:32%}
.carta{width:100%;height:230px;perspective:800px;cursor:pointer}
.interior{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.8s}
.carta.girada .interior{transform:rotateY(180deg)}
.cara{position:absolute;width:100%;height:100%;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.detras{background:linear-gradient(135deg,#e6007e,#3b1d6e,#a06ee1);border:3px solid #f5d76e;font-size:38px}
.delante{background:#fff7e6;color:#1a1030;transform:rotateY(180deg);border:3px solid #f5d76e}
.delante .emoji{font-size:38px}
.delante h2{font-size:14px;margin:6px 0 4px;line-height:1.1}
.delante p{font-size:12px;line-height:1.3}
.etiqueta{margin-top:8px;background:#f5d76e;color:#1a1030;padding:5px 10px;border-radius:20px;font-weight:bold;font-size:11px;display:inline-block}
#mensaje{font-size:17px;color:#f5d76e}
.tiktok{display:inline-block;background:black;color:white;text-decoration:none;padding:14px 20px;border-radius:30px;font-weight:bold;font-size:15px;border:2px solid #e6007e}
.pie{font-size:12px;opacity:0.7;margin-top:8px}
</style>
</head>
<body>
<div class="contenedor">
<div>
<p class="logo">🌙✨</p>
<h1>Tarot Nazaret</h1>
<p class="sub">Tu lectura de hoy, con mucho cariño 💜</p>
</div>
<div>
<button class="btn-tirar" onclick="tirar()">✨ Tirar 3 cartas ✨</button>
<div class="cartas" id="cartas"></div>
<div id="mensaje">✨ Toca cada carta para descubrirla ✨</div>
</div>
<div>
<p style="font-size:12px;opacity:0.8">Toca para girar 🔊</p>
<a class="tiktok" href="https://www.tiktok.com/@tarotnazaret" target="_blank">🎵 Sígueme @tarotnazaret</a>
<p class="pie">Hecho con amor por Tarot Nazaret 🌙</p>
</div>
</div>
<script>
const mazo=[
["El Loco","Lánzate, algo nuevo empieza.","🤪"],
["El Mago","Tienes todo para empezar.","🎩"],
["La Sacerdotisa","Escucha tu voz interior.","🔮"],
["La Emperatriz","Cuídate y quiérete mucho.","👑"],
["El Emperador","Orden y estabilidad.","🏰"],
["El Hierofante","Aprende de quien te guía.","🙏"],
["Los Enamorados","El corazón manda.","❤️"],
["El Carro","Avanzas, no te pares.","🏎️"],
["La Fuerza","Tú puedes con esto.","🦁"],
["El Ermitaño","Un momento para ti.","🕯️"],
["La Rueda","Viene un cambio bueno.","🎡"],
["La Justicia","Todo se pone en su sitio.","⚖️"],
["El Colgado","Mira todo de otra forma.","🙃"],
["La Muerte","Se acaba algo y nace algo mejor.","🦋"],
["La Templanza","Calma, todo llega.","🕊️"],
["El Diablo","Suelta lo que te ata.","😈"],
["La Torre","Un cambio brusco para bien.","⚡"],
["La Estrella","Esperanza y calma.","⭐"],
["La Luna","Confía en tu intuición.","🌙"],
["El Sol","Viene algo muy bonito.","☀️"],
["El Juicio","Es tu momento de renacer.","🎺"],
["El Mundo","Se cierra un ciclo bonito.","🌍"]
];
function sonido(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();let g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.setValueAtTime(1320,ctx.currentTime+0.15);g.gain.setValueAtTime(0.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.start();o.stop(ctx.currentTime+0.5);}catch(e){}}
function tirar(){sonido();let copiado=[...mazo].sort(()=>Math.random()-0.5).slice(0,3);let titulos=["PASADO","PRESENTE","FUTURO"];let html="";copiado.forEach((c,i)=>{html+=`<div class="col"><div class="carta" onclick="this.classList.toggle('girada');sonido()"><div class="interior"><div class="cara detras">🌙<br><span style="font-size:11px">TAROT<br>NAZARET</span></div><div class="cara delante"><div class="emoji">${c[2]}</div><h2>${c[0]}</h2><p>${c[1]}</p></div></div></div><div class="etiqueta">${titulos[i]}</div></div>`;});document.getElementById("cartas").innerHTML=html;}
tirar();
</script>
</body>
</html>
